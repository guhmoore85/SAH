name: Sync EveryAction to Airtable

on:
  # Run daily at 6:30 AM UTC (30 minutes after BigQuery refresh at 6:00 AM)
  schedule:
    - cron: '30 6 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      row_limit:
        description: 'Limit rows for testing (0 = no limit)'
        required: false
        default: '0'
        type: string
      sync_mode:
        description: 'Sync mode — use "replace" to wipe and re-insert'
        required: false
        default: 'upsert'
        type: choice
        options: ['upsert', 'replace']

# Prevent overlapping sync runs
concurrency:
  group: everyaction-airtable-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EveryAction → Airtable sync
        timeout-minutes: 50
        run: python sync_sheet_to_airtable.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.EVERYACTION_AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.EVERYACTION_AIRTABLE_TABLE_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.EVERYACTION_GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: everyaction_master
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'upsert' }}
          SYNC_KEY_FIELDS: type,name
          EXCLUDE_FIELDS: engagement_rate
          ROW_LIMIT: ${{ github.event.inputs.row_limit || '0' }}

      - name: Generate sync summary
        if: always()
        run: |
          echo "### EveryAction → Airtable Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Row Limit | ${{ github.event.inputs.row_limit || 'None (full sync)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "Sync completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "Sync failed - check logs above for details" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyaction-sync-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
