name: Check Social Airtable Base

on:
  workflow_dispatch:
    inputs:
      base_id:
        description: 'Airtable base ID (leave blank for default: appEYxbed1rP9wyUq / SAH_Social_2026)'
        required: false
        default: ''
      table_id:
        description: 'Airtable table ID to inspect (leave blank for default: tbl5WCOhWD0c8tum5 / Combined_social)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Airtable base check
        run: python check_social_airtable.py
        env:
          # Reuses the existing AIRTABLE_PAT secret. If it wasn't granted
          # access to base appEYxbed1rP9wyUq, this will fail with a
          # permission/not-found error -- either grant that PAT access to
          # this base in Airtable's token settings, or add a separate
          # SOCIAL_AIRTABLE_PAT secret instead.
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          # check_social_airtable.py does os.getenv("SOCIAL_AIRTABLE_BASE_ID",
          # "appEYxbed1rP9wyUq") -- that default only applies when the var is
          # UNSET, not when it's set to an empty string, so the || fallback
          # has to happen here instead of relying on the script's own default.
          SOCIAL_AIRTABLE_BASE_ID: ${{ inputs.base_id || 'appEYxbed1rP9wyUq' }}
          SOCIAL_AIRTABLE_TABLE_ID: ${{ inputs.table_id || 'tbl5WCOhWD0c8tum5' }}
