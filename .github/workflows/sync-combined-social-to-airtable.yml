name: Sync Combined Social to Airtable

on:
  schedule:
    # Weekly, Monday 9 AM UTC -- same slot as gmail-bq-weekly.yml.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'upsert (default, safe) or replace (delete-and-recreate)'
        required: false
        default: 'upsert'
      row_limit:
        description: 'Optional row limit for a test run (leave blank for all rows)'
        required: false
        default: ''
      days_back:
        description: 'Rolling window in days (leave blank for default: 365)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    # The query is now scoped to a rolling DAYS_BACK window (default 365,
    # see sync_combined_social_to_airtable.py), but the first run after
    # narrowing that window still has ~97k pre-existing Airtable records to
    # prune, and Airtable's API hard-limits batches to 10 records each --
    # keep a generous ceiling.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync BigQuery combined_metrics_full -> Airtable Combined_social
        run: python sync_combined_social_to_airtable.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT: "stopaapihate-472516"
          # Reuses the existing AIRTABLE_PAT secret. If it wasn't granted
          # access to base appEYxbed1rP9wyUq (SAH_Social_2026), this will
          # fail with a permission/not-found error -- grant that PAT access
          # to this base in Airtable's token settings first.
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          # inputs.* is undefined on a schedule-triggered run (no
          # workflow_dispatch inputs exist then), which would otherwise send
          # an empty SYNC_MODE and fall through to "replace" (delete-and-
          # recreate) instead of the intended default -- guard with ||.
          SYNC_MODE: ${{ inputs.sync_mode || 'upsert' }}
          ROW_LIMIT: ${{ inputs.row_limit || '' }}
          DAYS_BACK: ${{ inputs.days_back || '' }}
