version: 2

sources:
  - name: social_media
    database: stopaapihate-472516
    schema: social_media
    tables:
      - name: combined_metrics_full
        description: Deduped social media posts across all platforms (Instagram, Facebook, etc.)

  - name: fivetran_facebook
    database: stopaapihate-472516
    schema: social_media_reporting_facebook_pages
    tables:
      - name: facebook_pages__posts_report
        description: Fivetran-managed Facebook page post metrics

  - name: fivetran_instagram
    database: stopaapihate-472516
    schema: social_media_reporting_instagram_business
    tables:
      - name: instagram_business__posts
        description: >
          Fivetran-managed Instagram business post metrics. NOT currently
          used -- this transformation has been stuck ~5 months behind since
          spring 2026 despite the raw synced tables (instagram_business
          source below) being current. Use stg_instagram_raw instead until
          Fivetran's transformation is fixed.

  - name: instagram_business
    database: stopaapihate-472516
    schema: instagram_business
    tables:
      - name: media_history
        description: Raw Fivetran-synced Instagram media (posts, reels, carousels, stories)
      - name: media_insights
        description: Raw Fivetran-synced per-media Instagram insights (likes, views, impressions, etc.)

  - name: tiktok_organic_app
    database: stopaapihate-472516
    schema: tiktok_organic_app
    tables:
      - name: video
        description: Raw Fivetran-synced TikTok videos with engagement metrics (one row per video)
      - name: profile
        description: Raw Fivetran-synced TikTok account profile (follower counts, etc.)

  - name: google_analytics_4
    database: stopaapihate-472516
    schema: google_analytics_4
    tables:
      - name: airtable_active_365d
        description: GA4 web analytics for the last 365 days — one row per date × dimension value

  - name: everyaction_reports
    database: stopaapihate-472516
    schema: everyaction_reports
    tables:
      - name: email_comparison
        description: Raw EveryAction email comparison report; may have multiple snapshots per campaign
      - name: forms_report
        description: Raw EveryAction forms report; may have multiple snapshots per form
